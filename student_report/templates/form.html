<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='table.css') }}">
    <title>Student Report Form</title>
</head>
<body>
    <div class="page-shell">
        <section class="form-card">
            <header>
                <h1>Student Report Form</h1>
                <p>Fill in the student details and submit to see the report.</p>
            </header>

            <form action="{{ url_for('report') }}" method="POST" class="student-form">
                <label for="name">Student Name</label>
                <input type="text" id="name" name="name" placeholder="Enter full name" required>

                <label for="roll">Roll Number</label>
                <input type="text" id="roll" name="roll" placeholder="Enter roll number" required>

                <label for="marks">Obtained Marks</label>
                <input type="number" id="marks" name="marks" placeholder="Enter marks out of 500" min="0" max="500" required>

                <button type="submit">Generate Report</button>
            </form>
        </section>
    </div>
</body>
</html>
