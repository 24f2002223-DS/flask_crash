<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main>
        <h1>Hello {{ name }}</h1>
        <p>{{ message }}</p>

        <nav>
            <ul>
                <li><a class="button" href="{{ url_for('sc') }}">Set cookie</a></li>
                <li><a class="button" href="{{ url_for('gc') }}">Get cookie</a></li>
                <li><a class="button" href="{{ url_for('rc') }}">Remove cookie</a></li>
                <li><a class="button" href="{{ url_for('logout') }}">Logout</a></li>
            </ul>
        </nav>
    </main>
</body>
</html>
